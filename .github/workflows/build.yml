name: Build and Push Docker Image

on:
  push:
    branches:
      - main      # Build khi push lên main
#      - develop   # Build khi push lên develop
  workflow_dispatch:  # Cho phép chạy thủ công từ giao diện GitHub
jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/deepapp-bigdata-ml-traininghub:latest
         # ${{ secrets.DOCKERHUB_USERNAME }}/deepapp-bigdata-ml-traininghub:${{ github.sha }}