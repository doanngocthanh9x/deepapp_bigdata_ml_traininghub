spring.application.name=deepapp_main

# Disable database for testing
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# File Upload Size Limits
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
server.tomcat.max-swallow-size=100MB

# Spring Scheduling
spring.task.scheduling.enabled=true

# Logging
logging.level.com.deepapp.vn.io.controller.DischargePaperOCRController=DEBUG
logging.level.com.deepapp.vn.io.workers.PythonWorkerClient=DEBUG

# Unified Temp Directory Structure
document.temp.path=/tmp/deepapp/temp
document.storage.path=/tmp/deepapp/uploads
cpp.worker.pages.path=/tmp/deepapp/pages
cpp.worker.images.path=/tmp/deepapp/images

# Temp File Cleanup (hours)
temp.cleanup.interval.hours=24
temp.file.max.age.hours=48

# Worker configurations - External gRPC Hub Server
workers.cpp.host=localhost
workers.cpp.port=50051
workers.cpp.targetId=cpp-worker
workers.cpp.enabled=true

# C++ Worker Lifecycle - Enable auto-start
cpp.worker.autoStart=true
cpp.worker.autoBuild=true
